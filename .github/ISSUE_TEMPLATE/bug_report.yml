name: Bug Report
description: File a bug report or compiler issue
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in Datara & Forgen!
  - type: textarea
    id: problem
    attributes:
      label: Problem Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal Reproducible Example
      description: Provide the smallest .dtr snippet that triggers the bug.
      render: datara
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen, and what happened instead (compiler diagnostic, ICE, crash)?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Forgen Version & Environment
      description: Output of `forgen --version` or OS info (Windows, Ubuntu, macOS, etc.)
    validations:
      required: true
