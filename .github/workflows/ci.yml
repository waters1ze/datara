name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Format and lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy correctness check
        run: cargo clippy --all-targets -- -D clippy::correctness

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --verbose

      - name: Test
        # -j 2 reduces concurrent linking, which is unreliable on Windows.
        run: cargo test --release -j 2 --no-fail-fast

  clippy-count:
    name: Clippy warning count
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Count warnings
        shell: pwsh
        run: |
          $output = cargo clippy --all-targets --message-format short 2>&1
          $warns = ($output | Select-String -Pattern "warning:").Count
          if (-not $warns) { $warns = 0 }
          Write-Host "Total Clippy Warnings: $warns"
          exit 0

